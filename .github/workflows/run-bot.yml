name: Run Telegram Bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: telegram-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        ports:
          - 8081:8081
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_LOCAL: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          LOCAL_API_HOST: "http://localhost:8081"
          MAX_RUNTIME_SECONDS: "20700"
        run: python bot.py

      - name: Save updated users list back to repo
        if: always()
        run: |
          git config user.name "telegram-bot-runner"
          git config user.email "actions@users.noreply.github.com"
          git add users.json || true
          git diff --cached --quiet || git commit -m "chore: update users.json [skip ci]"
          git push || true
